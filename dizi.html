<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dizi Detayı - DiziAlem</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="apple-touch-icon" href="/static/img/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <a href="/" class="nav-brand">
      <img src="/static/img/logo.png" alt="DiziAlem" class="nav-logo-img">
    </a>

    <div class="nav-links">
      <a href="/" class="nav-btn primary">
        <i class="fas fa-home"></i> Ana Sayfa
      </a>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="main-container">

    <!-- DETAIL HERO -->
    <section id="detailHero" class="detail-hero">
      <div class="detail-hero-overlay"></div>
      <div class="detail-content">
        <img id="detailPoster" src="" alt="Poster" class="detail-poster-img">
        
        <div class="detail-info">
          <div class="hero-badges" id="detailBadges">
            <!-- Badges -->
          </div>
          
          <h1 id="detailTitle" class="detail-title">Yükleniyor...</h1>
          
          <div class="detail-stats">
            <div class="stat-item"><i class="fas fa-star"></i> <span id="detailRating">9.8</span></div>
            <div class="stat-item"><i class="fas fa-eye"></i> <span id="detailViews">100K</span></div>
            <div class="stat-item"><i class="fas fa-layer-group"></i> <span id="detailEpCount">0 Bölüm</span></div>
          </div>

          <p id="detailDesc" class="detail-desc"></p>

          <div class="hero-actions">
            <a href="#" id="watchFirstBtn" class="btn-cta">
              <i class="fas fa-play"></i> 1. Bölümü İzle
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- EPISODES SECTION -->
    <section class="episodes-section">
      <div class="section-header">
        <h2 class="section-title">
          <i class="fas fa-list-ol"></i> Tüm Bölümler
        </h2>
      </div>

      <div class="episodes-grid" id="episodesGrid">
        <!-- Rendered by dizi.js -->
      </div>
    </section>

  </main>

  <script src="/static/js/dizi.js"></script>
</body>
</html>
