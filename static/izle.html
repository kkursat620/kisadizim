<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dizi İzle - DiziAlem</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="apple-touch-icon" href="/static/img/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- HLS.js for M3U8 playback in standard browsers -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
</head>
<body class="player-page">

  <!-- VERTICAL 9:16 VIEWPORT -->
  <div class="vertical-viewport" id="playerViewport">

    <!-- VIDEO ELEMENT -->
    <video
      id="videoPlayer"
      class="video-element"
      playsinline
      webkit-playsinline
      x5-playsinline
      autoplay
      preload="auto"
    ></video>

    <!-- FAST-START LOADING SPINNER -->
    <div id="videoLoader" class="video-loader">
      <div class="loader-spinner"></div>
      <span class="loader-text">Dizi Yükleniyor...</span>
    </div>

    <!-- TAP TO PLAY OVERLAY (Mobil Otomatik Başlatma Engellendiğinde) -->
    <div id="tapPlayOverlay" class="tap-play-overlay" style="display: none;">
      <div class="tap-play-btn"><i class="fas fa-play"></i></div>
      <span>İzlemek İçin Dokunun</span>
    </div>

    <!-- DOUBLE TAP RIPPLE OVERLAYS -->
    <div id="seekLeft" class="seek-ripple left">
      <i class="fas fa-rotate-left"></i> -10s
    </div>
    <div id="seekRight" class="seek-ripple right">
      +10s <i class="fas fa-rotate-right"></i>
    </div>

    <!-- CENTER TAP PLAY/PAUSE INDICATOR -->
    <div id="centerTapIndicator" class="center-tap-indicator">
      <i class="fas fa-play"></i>
    </div>

    <!-- AUTO-NEXT TOAST -->
    <div id="autoNextToast" class="auto-next-toast">
      <i class="fas fa-forward" style="color: var(--primary);"></i>
      <span>Sonraki bölüme geçiliyor: <b id="countdownSec">3</b>s</span>
      <button id="cancelAutoNextBtn" style="color: var(--text-muted); font-size: 0.8rem; text-decoration: underline;">İptal</button>
    </div>

    <!-- TOP BAR -->
    <div class="player-top-bar">
      <button id="backBtn" class="btn-back" title="Geri">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div class="player-header-info">
        <div id="playerSeriesTitle" class="player-series-title">Dizi Adı</div>
        <div id="playerEpTitle" class="player-ep-title">Bölüm 1</div>
      </div>
    </div>

    <!-- RIGHT FLOATING ACTIONS -->
    <div class="player-side-actions">
      <!-- Episode List Drawer Button -->
      <button id="btnOpenDrawer" class="side-action-btn" title="Bölüm Listesi">
        <i class="fas fa-list-ul"></i>
        <span>Bölümler</span>
      </button>

      <!-- Playback Speed -->
      <button id="btnSpeed" class="side-action-btn" title="Oynatma Hızı">
        <span id="speedText" style="font-size: 0.85rem; font-weight: 800;">1x</span>
        <span>Hız</span>
      </button>

      <!-- Mute/Unmute -->
      <button id="btnMute" class="side-action-btn" title="Sesi Aç/Kapat">
        <i class="fas fa-volume-up" id="muteIcon"></i>
        <span>Ses</span>
      </button>

      <!-- Fullscreen -->
      <button id="btnFullscreen" class="side-action-btn" title="Tam Ekran">
        <i class="fas fa-expand"></i>
        <span>Ekran</span>
      </button>
    </div>

    <!-- BOTTOM CONTROLS & PROGRESS -->
    <div class="player-bottom-bar">
      <!-- Progress Bar -->
      <div class="progress-container" id="progressContainer">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="player-controls-row">
        <div id="timeDisplay" style="color: #d1d5db; font-size: 0.8rem; font-variant-numeric: tabular-nums;">
          00:00 / 00:00
        </div>

        <div class="nav-episode-btns">
          <button id="btnPrevEp" class="ep-nav-btn">
            <i class="fas fa-chevron-left"></i> Önceki
          </button>
          <button id="btnNextEp" class="ep-nav-btn">
            Sonraki <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- EPISODE SELECTOR DRAWER / SHEET -->
    <div class="episode-drawer" id="episodeDrawer">
      <div class="drawer-header">
        <div class="drawer-title">
          <i class="fas fa-layer-group" style="color: var(--primary);"></i> Bölüm Seçin
        </div>
        <button id="btnCloseDrawer" class="drawer-close-btn">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="drawer-list" id="drawerList">
        <!-- Rendered by player.js -->
      </div>
    </div>

  </div>

  <script src="/static/js/player.js"></script>
</body>
</html>
